<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Jayinnn's Blog · CMS</title>
  </head>
  <body>
    <!-- Sveltia CMS, pinned: this page gets write access to the repo, so upgrade deliberately. -->
    <script src="https://unpkg.com/@sveltia/cms@0.227.3/dist/sveltia-cms.js"></script>
    <script>
      // Render the editor preview with the blog's own fonts and styles (the preview then runs in
      // an iframe). These URLs aren't cache-busted, so after a style change the preview may lag
      // behind for a few hours; the live site is unaffected.
      CMS.registerPreviewStyle('/css/fonts.css');
      CMS.registerPreviewStyle('/css/main.css');
      CMS.registerPreviewStyle(`
        @import url('/css/dark.css') (prefers-color-scheme: dark);
        /* Same column as a post page */
        body { max-width: 800px; margin: 0 auto; padding: 1rem 1.5rem; }
      `, { raw: true });

      // Preview laid out like a post page (single.html): title, date, body, tags. Without this the
      // default preview prints every field label as an <h4>, which the theme styles as "#### Label".
      (function () {
        var h = CMS.React.createElement;
        var js = function (v) { return v && v.toJS ? v.toJS() : v; };
        var PostPreview = function (props) {
          var get = function (k) { return js(props.entry.getIn(['data', k])); };
          var date = get('date');
          var tags = get('tags') || [];
          return h('main', null, h('article', null,
            h('div', { className: 'title' },
              h('h1', { className: 'title' }, get('title') || 'Untitled'),
              h('div', { className: 'meta' },
                date ? String(date instanceof Date ? date.toISOString() : date).slice(0, 10) : '',
                get('draft') ? h('span', { className: 'draft-label' }, 'DRAFT') : null),
              get('description') ? h('div', { className: 'meta' }, get('description')) : null),
            h('section', { className: 'body' }, props.widgetFor('body')),
            tags.length ? h('div', { className: 'post-tags' }, h('nav', { className: 'nav tags' },
              h('ul', { className: 'tags' }, tags.filter(Boolean).map(function (t) {
                return h('li', { key: t }, h('a', null, t));
              })))) : null));
        };
        CMS.registerPreviewTemplate('posts', PostPreview);
        CMS.registerPreviewTemplate('diaries', PostPreview);
      })();
    </script>
    <!-- Bump ?v= when editing editor-components.js: static JS is cached for 4 hours. -->
    <script src="/admin/editor-components.js?v=2"></script>
  </body>
</html>
