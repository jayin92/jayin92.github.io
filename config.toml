baseurl = "https://blog.jayinnn.dev/"
locale = "zh-tw"
title = "Jayinnn's Blog"
theme = "archie"
copyright = "Jayinnn © CC BY-NC-SA 4.0"

defaultContentLanguage = "zh-tw"
defaultContentLanguageInSubdir = false

[languages.zh-tw]
locale = "zh-tw"
label = "中文"
weight = 1

[languages.en]
locale = "en"
label = "English"
weight = 2

# Code Highlight — configured under [markup.highlight] below

[languages.zh-tw.params]
  subtitle = "記錄修課、專題與生活的個人部落格"
  intro = "我是李杰穎（Jayinnn），畢業於陽明交大資工系，大四上學期到蘇黎世聯邦理工學院（ETH Zürich）交換。這裡記錄修課心得、專題和生活。"

[[languages.zh-tw.menus.main]]
  name = "首頁"
  url = "/"
  weight = 1

[[languages.zh-tw.menus.main]]
  name = "文章"
  url = "/posts"
  weight = 2

[[languages.zh-tw.menus.main]]
  name = "關於"
  url = "/about"
  weight = 3

[[languages.zh-tw.menus.main]]
  name = "標籤"
  url = "/tags"
  weight = 4

[pagination]
  pagerSize = 10 # articles per page


[params]
	mode="auto" # color-mode → light,dark or auto
	useCDN=false # don't use CDNs for fonts and icons, instead serve them locally.
	subtitle = "A Blog about My Daily Life"
	mainSections = ["posts"]
	# Shown under "Start here" on the home page (content paths; skipped if missing/draft)
	featured = ["posts/eth", "posts/eth-cg24-final-project", "posts/eth-tutorial"]

# Comments (giscus). Comments render only when repoId and categoryId are set.
# Get the IDs from https://giscus.app after enabling Discussions + installing the giscus app.
[params.giscus]
  repo = "jayin92/jayin92.github.io"
  repoId = "MDEwOlJlcG9zaXRvcnkzNjQ4OTE4NTg="
  category = "Announcements"
  categoryId = "DIC_kwDOFb_O0s4DG4Du"

# Social Tags

[[params.social]]
  name = "Personal Page"
  icon = "home"
  url = "https://jayinnn.dev"

[[params.social]]
  name = "GitHub"
  icon = "github"
  url = "https://github.com/jayin92/"

[[params.social]]
  name = "Linkedin"
  icon = "linkedin"
  url = "https://www.linkedin.com/in/jayinnn/"

[[params.social]]
  name = "Email"
  icon = "mail"
  url = "mailto:me@jayinnn.dev"

# Main menu Items

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Posts"
url = "/posts"
weight = 2


[[menu.main]]
name = "About"
url = "/about"
weight = 3

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 4


# Process content/image with Hugo's image pipeline (see partials/responsive-image.html).
# Declaring any mount replaces the defaults, so they are all listed here.
[module]
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "content/image"
    target = "assets/image"

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
    notAlternative = true

[markup]
  [markup.highlight]
    style = "monokai"
    codeFences = true
    guessSyntax = true
  [markup.tableOfContents]
    endLevel = 2
    ordered = false
    startLevel = 2
  # Hugo auto-enables embedded link/image render hooks on multilingual
  # single-host sites; keep them off so zh output stays identical.
  [markup.goldmark.renderHooks.image]
    useEmbedded = "never"
  [markup.goldmark.renderHooks.link]
    useEmbedded = "never"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5