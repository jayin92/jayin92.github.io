<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
    {{- partial "header.html" . -}}
    <body>
        <a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>
        <div class="content">
        {{- partial "head.html" . -}}
        {{- block "main" . }}{{- end }}
        {{- partial "footer.html" . -}}
        </div>
        <script defer src="{{ partial "asset-url.html" "js/navbar-search.js" }}"></script>
        <script defer src="{{ partial "asset-url.html" "js/lightbox.js" }}" data-zoom="{{ i18n "image_zoom" }}" data-zoom-alt="{{ i18n "image_zoom_alt" }}"></script>
        <script defer src="{{ partial "asset-url.html" "js/nav-hide.js" }}"></script>
        <script defer src="{{ partial "asset-url.html" "js/code-copy.js" }}" data-copy="{{ i18n "code_copy" }}" data-copied="{{ i18n "code_copied" }}" data-failed="{{ i18n "code_copy_failed" }}"></script>
        <script defer src="{{ partial "asset-url.html" "js/heading-anchors.js" }}" data-label="{{ i18n "heading_link" }}"></script>
        {{- partial "analytics.html" . -}}
        <script>
        (function() {
            var link = document.getElementById('dark-css');
            var toggle = document.getElementById('theme-toggle');
            if (!link || !toggle) return;

            function isDark() {
                if (link.media === 'all') return true;
                if (link.media === 'not all') return false;
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            }

            function sync() {
                toggle.checked = isDark();
            }

            // localStorage throws when site data is blocked (e.g. Safari with cookies off)
            function saved() {
                try { return localStorage.getItem('theme'); } catch (e) { return null; }
            }

            function apply(dark) {
                link.media = dark ? 'all' : 'not all';
                try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
                // The browser toolbar colour follows too (header.html sets it the same way at load)
                var metas = document.querySelectorAll('meta[name="theme-color"]');
                for (var i = 0; i < metas.length; i++) metas[i].content = dark ? '#202124' : '#ffffff';
            }

            // Crossfade the whole page with a View Transition (a GPU snapshot fade, same cost on any
            // page, so phones and desktops behave alike). It replaced a 0.15s colour transition on
            // every element, which iPhone Safari couldn't keep up with on long pages.
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            toggle.addEventListener('change', function() {
                var dark = toggle.checked;
                if (document.startViewTransition && !reduceMotion.matches) {
                    // .theme-switching (main.css): the header fades with the page, at the same speed
                    var root = document.documentElement;
                    root.classList.add('theme-switching');
                    document.startViewTransition(function() { apply(dark); }).finished.finally(function() {
                        root.classList.remove('theme-switching');
                    });
                } else {
                    apply(dark);
                }
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
                if (!saved()) sync();
            });

            // Announced as an on/off switch rather than a checkbox
            toggle.setAttribute('role', 'switch');
            // The switch has already been drawn unchecked by now: set the real state with its
            // transitions off (.no-transition, main.css), or a dark page slides the knob on every load.
            var sw = toggle.closest('.theme-switch');
            if (sw) sw.classList.add('no-transition');
            sync();
            if (sw) {
                void sw.offsetWidth;
                sw.classList.remove('no-transition');
            }
        })();
        </script>
    </body>
</html>
