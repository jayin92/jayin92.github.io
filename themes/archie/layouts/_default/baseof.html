<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
    {{- partial "header.html" . -}}
    <body>
        <a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>
        <div class="content">
        {{- partial "head.html" . -}}
        {{- block "main" . }}{{- end }}
        {{- partial "footer.html" . -}}
        </div>
        <script defer src="{{ partial "asset-url.html" "js/navbar-search.js" }}"></script>
        <script defer src="{{ partial "asset-url.html" "js/lightbox.js" }}" data-zoom="{{ i18n "image_zoom" }}" data-zoom-alt="{{ i18n "image_zoom_alt" }}" data-prev="{{ i18n "image_prev" }}" data-next="{{ i18n "image_next" }}" data-position="{{ i18n "image_position" }}" data-position-alt="{{ i18n "image_position_alt" }}"></script>
        <script defer src="{{ partial "asset-url.html" "js/nav-hide.js" }}"></script>
        <script defer src="{{ partial "asset-url.html" "js/code-copy.js" }}" data-copy="{{ i18n "code_copy" }}" data-copied="{{ i18n "code_copied" }}" data-failed="{{ i18n "code_copy_failed" }}"></script>
        <script defer src="{{ partial "asset-url.html" "js/heading-anchors.js" }}" data-label="{{ i18n "heading_link" }}"></script>
        {{- partial "analytics.html" . -}}
        <script>
        // Theme button (partials/head.html): light / dark / follow the system. The choice lives in
        // localStorage.theme ('light' | 'dark', absent = system) and in data-theme-choice on <html>,
        // which partials/header.html sets before the first paint along with the dark.css link's media
        // and the theme-color metas; apply() changes all of them the same way.
        (function() {
            var link = document.getElementById('dark-css');
            var toggle = document.getElementById('theme-toggle');
            if (!link || !toggle) return;
            var root = document.documentElement;
            var status = document.getElementById('theme-status');
            var systemMedia = link.getAttribute('data-system-media') || '(prefers-color-scheme: dark)';
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

            function valid(choice) {
                return choice === 'light' || choice === 'dark' ? choice : 'system';
            }
            var choice = valid(root.getAttribute('data-theme-choice'));

            function isDark(c) {
                return c === 'dark' || (c === 'system' && window.matchMedia(systemMedia).matches);
            }

            // From "system" a click goes to the opposite of what's on screen, then to the other
            // theme, then back to the system. So every click changes the colours except the one back
            // to the system, and the first click on a fresh visit always does (a fixed light → dark →
            // system order would do nothing visible on a light OS).
            function next(c) {
                var sys = isDark('system') ? 'dark' : 'light';
                if (c === 'system') return sys === 'dark' ? 'light' : 'dark';
                return c === sys ? 'system' : sys;
            }

            function label(c) {
                return toggle.getAttribute('data-' + c) || 'Theme: ' + c;
            }

            function sync(c) {
                root.setAttribute('data-theme-choice', c);
                toggle.setAttribute('aria-label', label(c));
                toggle.title = label(c);
            }

            // Comments (partials/comments.html) follow the theme through this event
            function notify() {
                try {
                    document.dispatchEvent(new CustomEvent('themechange', { detail: { choice: choice, dark: isDark(choice) } }));
                } catch (e) {}
            }

            function apply(c) {
                link.media = c === 'dark' ? 'all' : c === 'light' ? 'not all' : systemMedia;
                // localStorage throws when site data is blocked (e.g. Safari with cookies off)
                try {
                    if (c === 'system') localStorage.removeItem('theme');
                    else localStorage.setItem('theme', c);
                } catch (e) {}
                sync(c);
                // The browser toolbar colour follows too. For the system, each meta gets back the
                // colour of its own media query, so the browser keeps following the OS by itself.
                var metas = document.querySelectorAll('meta[name="theme-color"]');
                for (var i = 0; i < metas.length; i++) {
                    var q = metas[i].getAttribute('media');
                    var dark = c === 'system' && q ? /dark/.test(q) : isDark(c);
                    metas[i].content = dark ? '#202124' : '#ffffff';
                }
                notify();
            }

            // Crossfade the whole page with a View Transition (a GPU snapshot fade, same cost on any
            // page, so phones and desktops behave alike). It replaced a 0.15s colour transition on
            // every element, which iPhone Safari couldn't keep up with on long pages.
            var latest = null;
            var statusTimer = null;
            toggle.addEventListener('click', function() {
                // `choice` moves on at once, so a second press during the fade goes one step further
                // (a key press: a mouse click then lands on the ::view-transition overlay)
                var c = choice = next(choice);
                if (status) {
                    // Screen readers don't reliably say a focused button's new name: announce it
                    status.textContent = label(c);
                    clearTimeout(statusTimer);
                    statusTimer = setTimeout(function() { status.textContent = ''; }, 3000);
                }
                if (document.startViewTransition && !reduceMotion.matches) {
                    // .theme-switching (main.css): the header fades with the page, at the same speed.
                    // A second press skips the running transition; only the latest one removes the class.
                    root.classList.add('theme-switching');
                    var vt = latest = document.startViewTransition(function() { apply(c); });
                    vt.finished.finally(function() {
                        if (latest === vt) root.classList.remove('theme-switching');
                    });
                } else {
                    apply(c);
                }
            });

            // Following the system: dark.css and the theme-color metas follow their media queries
            // live; the comments need telling.
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
                if (choice === 'system') notify();
            });

            // Back/forward cache: another page may have changed the theme since this one was shown
            window.addEventListener('pageshow', function(e) {
                if (!e.persisted) return;
                var saved;
                try { saved = localStorage.getItem('theme'); } catch (err) { return; }
                if (valid(saved) !== choice) apply(choice = valid(saved));
            });

            sync(choice);
        })();
        </script>
    </body>
</html>
